<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Excel - Llega Ya</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #FF6B00 0%, #E55A00 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #0D1B4A; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .upload-box { border: 3px dashed #FF6B00; border-radius: 12px; padding: 40px; text-align: center; background: #FFF5EB; cursor: pointer; transition: all 0.3s; }
        .upload-box:hover { background: #FFE8D6; border-color: #E55A00; }
        .upload-box.dragover { background: #FFE8D6; border-color: #0D1B4A; }
        .icon { font-size: 4em; margin-bottom: 15px; }
        input[type="file"] { display: none; }
        .btn { background: linear-gradient(135deg, #FF6B00 0%, #E55A00 100%); color: white; padding: 15px 30px; border: none; border-radius: 10px; font-size: 1em; font-weight: 700; cursor: pointer; margin-top: 20px; width: 100%; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .mapping { margin-top: 30px; display: none; }
        .mapping.show { display: block; }
        .mapping h3 { color: #0D1B4A; margin-bottom: 15px; }
        .mapping-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .mapping-item { background: #f8f9fa; padding: 15px; border-radius: 8px; }
        .mapping-item label { display: block; font-weight: 700; color: #333; margin-bottom: 5px; font-size: 0.9em; }
        .mapping-item select { width: 100%; padding: 8px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 0.9em; }
        .preview { max-height: 300px; overflow-y: auto; margin-top: 20px; border: 1px solid #e0e0e0; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th { background: #FF6B00; color: white; padding: 10px; text-align: left; position: sticky; top: 0; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        .success { background: #11998e; color: white; padding: 15px; border-radius: 10px; margin-top: 20px; display: none; }
        .success.show { display: block; }
        .error { background: #E53935; color: white; padding: 15px; border-radius: 10px; margin-top: 20px; display: none; }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚚 Conversor Excel - Llega Ya</h1>
        <p class="subtitle">Convierte tu Excel al formato de Supabase</p>
        
        <div class="upload-box" onclick="document.getElementById('fileInput').click()" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
            <div class="icon">📊</div>
            <h3>Arrastra tu archivo Excel aquí</h3>
            <p>o haz clic para seleccionar</p>
            <p style="font-size: 0.85em; color: #666; margin-top: 10px;">Formatos: .xlsx, .xls, .csv</p>
        </div>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="handleFile(event)">
        
        <div id="mappingSection" class="mapping">
            <h3> Mapeo de Columnas</h3>
            <p style="color: #666; margin-bottom: 15px; font-size: 0.9em;">La app detectó automáticamente las columnas. Verifica que coincidan:</p>
            <div class="mapping-grid" id="mappingGrid"></div>
            <div class="preview" id="preview"></div>
            <button class="btn" onclick="convertAndDownload()">💾 Descargar CSV para Supabase</button>
        </div>
        
        <div id="successMsg" class="success"></div>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        let excelData = [];
        let excelHeaders = [];
        let columnMapping = {};

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) processFile(file);
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('dragover');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (file) processFile(file);
        }

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
                    
                    // Find header row
                    let headerRowIndex = 0;
                    for (let i = 0; i < Math.min(10, jsonData.length); i++) {
                        const row = jsonData[i];
                        if (row && row.some(cell => {
                            const v = String(cell).toLowerCase().trim();
                            return v.includes('code') || v.includes('name') || v.includes('contact') || v.includes('address');
                        })) {
                            headerRowIndex = i;
                            break;
                        }
                    }
                    
                    excelHeaders = jsonData[headerRowIndex].map(h => String(h || '').trim());
                    excelData = jsonData.slice(headerRowIndex + 1).filter(row => row.some(cell => String(cell).trim() !== ''));
                    
                    if (excelData.length === 0) {
                        showError('No se encontraron datos en el archivo');
                        return;
                    }
                    
                    autoMapColumns();
                    showMapping();
                    showSuccess(`✓ ${excelData.length} filas detectadas`);
                } catch (err) {
                    showError('Error al leer el archivo: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function autoMapColumns() {
            const mapping = {
                'tracking_code': ['code', 'tracking', 'order', 'id'],
                'client_name': ['customer name', 'contact name', 'name', 'client', 'dropoff contact name'],
                'client_phone': ['dropoff contact', 'phone', 'teléfono', 'telefono', 'contact', 'cell'],
                'product_info': ['note', 'product', 'descripcion', 'description', 'item', 'producto'],
                'client_address': ['drop off address', 'dropoff address', 'address', 'direccion', 'delivery'],
                'price': ['cod', 'price', 'monto', 'amount', 'total', 'precio'],
                'zone': ['zone', 'zona', 'city', 'ciudad', 'area'],
                'store': ['pickup', 'store', 'tienda', 'origen', 'warehouse']
            };
            
            const headersLower = excelHeaders.map(h => h.toLowerCase().trim());
            
            for (const [supabaseCol, keywords] of Object.entries(mapping)) {
                for (const keyword of keywords) {
                    const idx = headersLower.findIndex(h => h.includes(keyword));
                    if (idx !== -1) {
                        columnMapping[supabaseCol] = idx;
                        break;
                    }
                }
            }
        }

        function showMapping() {
            const grid = document.getElementById('mappingGrid');
            const labels = {
                'tracking_code': '📦 Código de seguimiento',
                'client_name': '👤 Nombre del cliente',
                'client_phone': ' Teléfono',
                'product_info': '📝 Producto/Nota',
                'client_address': '📍 Dirección de entrega',
                'price': '💵 Precio/COD',
                'zone': ' Zona',
                'store': ' Tienda/Origen'
            };
            
            let html = '';
            for (const [supabaseCol, label] of Object.entries(labels)) {
                const currentMapping = columnMapping[supabaseCol] !== undefined ? columnMapping[supabaseCol] : '';
                html += `
                    <div class="mapping-item">
                        <label>${label}</label>
                        <select id="map_${supabaseCol}" onchange="columnMapping['${supabaseCol}'] = this.value">
                            <option value="">-- No asignar --</option>
                            ${excelHeaders.map((h, i) => `
                                <option value="${i}" ${currentMapping == i ? 'selected' : ''}>${h || 'Columna ' + (i+1)}</option>
                            `).join('')}
                        </select>
                    </div>
                `;
            }
            grid.innerHTML = html;
            
            // Show preview
            showPreview();
            document.getElementById('mappingSection').classList.add('show');
        }

        function showPreview() {
            const preview = document.getElementById('preview');
            const requiredFields = ['tracking_code', 'client_name', 'client_phone', 'product_info'];
            const missingRequired = requiredFields.filter(f => columnMapping[f] === undefined || columnMapping[f] === '');
            
            if (missingRequired.length > 0) {
                preview.innerHTML = `<div style="padding: 15px; background: #FFEBEE; color: #C62828; border-radius: 8px;">
                    <strong>⚠️ Faltan columnas requeridas:</strong><br>
                    ${missingRequired.map(f => '• ' + f).join('<br>')}
                </div>`;
                return;
            }
            
            let html = '<table><thead><tr>';
            html += Object.keys(columnMapping).filter(k => columnMapping[k] !== undefined && columnMapping[k] !== '').map(k => `<th>${k}</th>`).join('');
            html += '</tr></thead><tbody>';
            
            excelData.slice(0, 5).forEach(row => {
                html += '<tr>';
                for (const [supabaseCol, colIndex] of Object.entries(columnMapping)) {
                    if (colIndex !== undefined && colIndex !== '') {
                        html += `<td>${row[colIndex] || ''}</td>`;
                    }
                }
                html += '</tr>';
            });
            html += '</tbody></table>';
            
            if (excelData.length > 5) {
                html += `<div style="padding: 10px; text-align: center; color: #666; font-size: 0.85em;">... y ${excelData.length - 5} filas más</div>`;
            }
            
            preview.innerHTML = html;
        }

        function convertAndDownload() {
            const requiredFields = ['tracking_code', 'client_name', 'client_phone', 'product_info'];
            const missingRequired = requiredFields.filter(f => columnMapping[f] === undefined || columnMapping[f] === '');
            
            if (missingRequired.length > 0) {
                showError('Debes mapear las columnas requeridas: ' + missingRequired.join(', '));
                return;
            }
            
            const csvRows = [];
            const headers = Object.keys(columnMapping).filter(k => columnMapping[k] !== undefined && columnMapping[k] !== '');
            csvRows.push(headers.join(','));
            
            excelData.forEach(row => {
                const values = headers.map(header => {
                    const colIndex = columnMapping[header];
                    let value = row[colIndex] || '';
                    value = String(value).replace(/"/g, '""');
                    if (value.includes(',') || value.includes('"') || value.includes('\n')) {
                        value = `"${value}"`;
                    }
                    return value;
                });
                csvRows.push(values.join(','));
            });
            
            const csvContent = csvRows.join('\n');
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', 'llega_ya_import_' + new Date().toISOString().split('T')[0] + '.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showSuccess('✅ Archivo CSV descargado. Ahora impórtalo en Supabase.');
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
